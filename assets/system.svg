6" text-anchor="middle" font-size="13" fill="#9fd8bd">personal assistant</text></g> <g class="cube c4"><path d="M900,340 L990,385.0 L990,470.5 L900,425.5 Z" fill="#60441f" stroke="#8c632e" stroke-width="1"/><path d="M1080,340 L990,385.0 L990,470.5 L1080,425.5 Z" fill="#936830" stroke="#bf873f" stroke-width="1"/><path d="M990,295.0 L1080,340 L990,385.0 L900,340 Z" fill="#ffce60" stroke="#ffb454" stroke-width="1.6"/><text transform="matrix(1.8,0.9,-1.8,0.9,990,340)" font-size="28" fill="#04100b" text-anchor="middle" dominant-baseline="central" font-weight="700">W</text><text x="990" y="496" text-anchor="middle" font-size="19" fill="#eafff4" font-weight="700">WhatsApp AI</text><text x="990" y="516" text-anchor="middle" font-size="13" fill="#9fd8bd">agents in the inbox</text></g>

  <g><circle r="3" fill="#00ff9c" opacity="0.95"><animateMotion dur="3.1s" begin="-1.2s" repeatCount="indefinite" path="M420,239 V262 H210 V293"/></circle> <circle r="3" fill="#00d4ff" opacity="0.95"><animateMotion dur="3.4s" begin="-2.1s" repeatCount="indefinite" path="M420,239 V272 H470 V293"/></circle> <circle r="3" fill="#00ff9c" opacity="0.95"><animateMotion dur="2.9s" begin="-0.6s" repeatCount="indefinite" path="M420,239 V282 H730 V293"/></circle> <circle r="3" fill="#ffb454" opacity="0.95"><animateMotion dur="3.6s" begin="-1.8s" repeatCount="indefinite" path="M780,239 V272 H990 V293"/></circle></g>

  <text x="34" y="40" font-size="20" fill="#eafff4">the system</text>
  <text x="34" y="62" font-size="13" fill="#0f8f63">one message path from /start to renewal — all four products ride it</text>
</svg>
