<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="100%">
      <stop offset="0%" stop-color="#0a2016"/>
      <stop offset="60%" stop-color="#04100b"/>
      <stop offset="100%" stop-color="#020806"/>
    </radialGradient>
  </defs>
  <style>
    .slab, .cube { animation: bob ease-in-out infinite; }
    .ch1 { animation-duration: 6.2s; }
    .ch2 { animation-duration: 5.4s; animation-delay: -2.2s; }
    .c1 { animation-duration: 5.6s; }
    .c2 { animation-duration: 6.9s; animation-delay: -2.4s; }
    .c3 { animation-duration: 6.1s; animation-delay: -1.1s; }
    .c4 { animation-duration: 5.0s; animation-delay: -3.3s; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    .flow { stroke-dasharray: 4 9; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -13; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect x="12" y="12" width="1176" height="676" rx="14" fill="none" stroke="#00ff9c" stroke-opacity="0.22" stroke-width="1.5"/>

  <g class="platform"><path d="M140,575 L600,657.8 L600,681.8 L140,599 Z" fill="#042d1f" stroke="#074731" stroke-width="1"/><path d="M1060,575 L600,657.8 L600,681.8 L1060,599 Z" fill="#074a33" stroke="#0a6445" stroke-width="1"/><path d="M600,492.2 L1060,575 L600,657.8 L140,575 Z" fill="#109d6c" stroke="#0f8f63" stroke-width="1.5"/></g>

