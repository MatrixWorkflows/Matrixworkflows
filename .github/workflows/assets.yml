name: regenerate-3d-assets

on:
  schedule:
    - cron: "23 3 * * *" # daily, off the :00 mark
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/assets.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assets

jobs:
  skyline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate skyline from real GraphQL data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/generate_skyline.py --user MatrixWorkflows

      - name: Commit if changed
        run: |
          git config user.name "matrix-bot"
          git config user.email "actions@github.com"
          git add assets/skyline.svg
          git diff --cached --quiet || git commit -m "chore: regenerate contribution skyline [skip ci]"
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: MatrixWorkflows
          outputs: |
            dist/github-snake.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
